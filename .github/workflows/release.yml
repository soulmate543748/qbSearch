name: Release Obsidian plugin

# 打一个和 manifest.json 里 version 完全相同的 tag（例：1.1.0），
# 推上去自动构建并发 Release。BRAT 认的就是这个 Release 里的三个文件。
on:
  push:
    tags:
      - "*"

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm

      # npm ci 严格按 package-lock.json 装，比 npm install 可复现
      - name: Install dependencies
        run: npm ci

      # tag 和 manifest.json 的版本必须一模一样。
      # 不一致时 BRAT 装完还会一直提示"有新版本"——这个错很难自己看出来，先拦住
      - name: Check tag matches manifest version
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version=$(node -p "require('./manifest.json').version")
          if [ "$tag" != "$version" ]; then
            echo "::error::tag ($tag) 与 manifest.json 的 version ($version) 不一致。两者必须完全相同，否则 BRAT 会一直提示更新。"
            exit 1
          fi
          echo "版本一致：$version"

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Release 说明只取 CHANGELOG 里当前版本那一段，不把历史版本全贴上去
      - name: Extract release notes
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          awk -v ver="$tag" '
            index($0, "## " ver) == 1 { found = 1; next }
            found && index($0, "## ") == 1 { exit }
            found
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG.md 里没有 ${tag} 的小节，Release 说明留空。" > release-notes.md
          fi

      # 三个文件必须作为 Release 的 assets 挂上去，BRAT 只从这里取
      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" \
            --title="$tag" \
            --notes-file release-notes.md \
            main.js manifest.json styles.css
